<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小灶点餐 - 评价管理</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <h2>🏪 小灶后台</h2>
    <a href="dashboard.html">📊 数据看板</a>
    <a href="dishes.html">🍽 菜品管理</a>
    <a href="orders.html">📋 订单管理</a>
    <a href="reviews.html" class="active">⭐ 评价管理</a>
    <a href="coupons.html">🎫 优惠券管理</a>
    <a href="#" onclick="logout()" style="margin-top:40px;color:#666;">🚪 退出登录</a>
  </nav>
  <div class="main">
    <h1>评价管理</h1>
    <div class="filter-bar">
      <select id="ratingFilter" onchange="goPage(1)">
        <option value="">全部评分</option>
        <option value="5">5星</option>
        <option value="4">4星及以上</option>
        <option value="3">3星及以上</option>
        <option value="2">2星及以上</option>
        <option value="1">1星</option>
      </select>
      <span id="count" style="margin-left:auto;"></span>
    </div>
    <div class="table-wrap"><div id="review-list"></div></div>
  </div>
</div>
<script src="common.js"></script>
<script>
if (!adminToken) location.href = 'index.html';

let currentPage = 1;
const pageSize = 20;

async function goPage(page) {
  currentPage = page || 1;
  const minRating = document.getElementById('ratingFilter').value;
  let url = `/admin/reviews?page=${currentPage}&pageSize=${pageSize}`;
  if (minRating) url += `&minRating=${minRating}`;
  const data = await api('GET', url);
  document.getElementById('count').textContent = `共 ${data.total} 条评价`;
  if (!data.list || data.list.length === 0) {
    document.getElementById('review-list').innerHTML = '<div class="empty"><p>暂无评价</p></div>';
    return;
  }
  renderTable('review-list', ['用户','评分','标签','内容','时间'],
    data.list, r => `<td>${r.nickname}</td>
      <td style="color:#FFB800;font-weight:700;">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</td>
      <td>${(r.tags||[]).map(t=>`<span class="badge badge-pending">${t}</span>`).join(' ')}</td>
      <td>${r.content||'-'}</td>
      <td>${fmtDate(r.createdAt)}</td>`);
  renderPagination('review-list', data.total, currentPage, pageSize, 'goPage');
}

function logout() { localStorage.removeItem('adminToken'); location.href = 'index.html'; }

goPage(1);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小灶点餐 - 优惠券管理</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <h2>🏪 小灶后台</h2>
    <a href="dashboard.html">📊 数据看板</a>
    <a href="dishes.html">🍽 菜品管理</a>
    <a href="orders.html">📋 订单管理</a>
    <a href="reviews.html">⭐ 评价管理</a>
    <a href="coupons.html" class="active">🎫 优惠券管理</a>
    <a href="#" onclick="logout()" style="margin-top:40px;color:#666;">🚪 退出登录</a>
  </nav>
  <div class="main">
    <h1>优惠券管理</h1>
    <div class="table-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <span id="count"></span>
        <button class="btn btn-primary" onclick="showAdd()">+ 创建优惠券</button>
      </div>
      <div id="coupon-list"></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script>
if (!adminToken) location.href = 'index.html';

async function loadCoupons() {
  const coupons = await api('GET', '/admin/coupons');
  document.getElementById('count').textContent = `共 ${coupons.length} 张`;
  renderTable('coupon-list', ['ID','名称','类型','面值','门槛','有效期','已领/总量','状态','操作'],
    coupons, c => {
      const typeLabel = c.type==='reduction'?'满减':'折扣';
      const valueLabel = c.type==='reduction'?fmtPrice(c.value):(c.value*10)+'折';
      return `<td>${c.id}</td><td>${c.name}</td><td>${typeLabel}</td><td>${valueLabel}</td>
        <td>满${c.threshold}</td><td>${c.startDate} ~ ${c.endDate}</td>
        <td>${c.claimed}/${c.total}</td>
        <td><span class="badge ${c.isActive?'badge-available':'badge-used'}">${c.isActive?'启用':'停用'}</span></td>
        <td><button class="btn btn-sm btn-outline" onclick="toggleCoupon(${c.id},${!c.isActive})">${c.isActive?'停用':'启用'}</button></td>`;
    });
}

async function showAdd() {
  const name = prompt('优惠券名称 (如: 满100减20):'); if (!name) return;
  const type = prompt('类型 (reduction=满减, discount=折扣):', 'reduction');
  const value = parseFloat(prompt(type==='reduction'?'减免金额:':'折扣率(0.8=8折):', type==='reduction'?'10':'0.8'));
  const threshold = parseFloat(prompt('使用门槛(元):', '50'));
  const total = parseInt(prompt('发放总量:', '100'));
  const endDate = prompt('截止日期 (YYYY-MM-DD):', '2026-12-31');
  await api('POST', '/admin/coupons', { name, type, value, threshold, startDate: '2026-01-01', endDate, total });
  loadCoupons();
}

async function toggleCoupon(id, val) { await api('PUT', '/admin/coupons', { id, isActive: val }); loadCoupons(); }
function logout() { localStorage.removeItem('adminToken'); location.href = 'index.html'; }

loadCoupons();
</script>
</body>
</html>
